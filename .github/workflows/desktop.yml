name: Windows input fixture verification
on:
  push:
    branches: [codex/windows-editor-probe]
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42026196463
          name: windows-editor-probe-bundle
          path: probe-app
      - name: Verify native paragraph settings, paste and undo
        run: ./tool/windows-editor-rendering-test.ps1 -Executable probe-app/inkflow.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-editor-rendering
          path: render-probe/*.png
