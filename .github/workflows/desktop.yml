name: Windows manuscript rendering probe
on:
  push:
    branches: [codex/windows-editor-probe]
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Inspect released native editor
        run: ./tool/windows-editor-probe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-editor-rendering
          path: |
            render-probe/*.png
            render-probe/*-windows.json
