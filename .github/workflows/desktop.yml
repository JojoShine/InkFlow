name: Windows manuscript rendering regression
on:
  push:
    branches: [codex/windows-editor-probe]
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/editor/native_configuration_stability_test.dart
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-editor-probe-bundle
          path: build/windows/x64/runner/Release/
          retention-days: 2
      - name: Verify native text, pixels and saved input
        run: ./tool/windows-editor-rendering-test.ps1 -Executable build/windows/x64/runner/Release/inkflow.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-editor-rendering
          path: render-probe/*.png
